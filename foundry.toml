[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
amoy = "https://polygon-amoy-bor-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"

[etherscan]
amoy = { key = "${ETHERSCAN_API_KEY}", chain = 80002 }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
